<!DOCTYPE html>
<html>
<head><title>uBixOS NetSurf font test</title></head>
<body>
<h1>Heading (should be bold, large)</h1>
<p>Regular sans-serif body text. <b>This is bold.</b> <i>This is italic.</i>
<b><i>This is bold italic.</i></b></p>
<p style="font-family: serif">This paragraph is <b>serif</b> — note the
slab strokes. <i>Serif italic too.</i></p>
<p style="font-family: monospace">This is monospace: 0Oo1lI |#@.
<b>monospace bold</b>.</p>
<p style="font-size: 24px">Larger text to check scaling and antialiasing.</p>
</body>
</html>
