name: CI

# Gate suite = tools/check (docs/standards/).  Same entry point locally:
#   tools/check/run.sh [--tier ci]
#
# Blocking:  lint  (cheap, changed-files-only gates; no toolchain needed)
# Advisory:  build / analyze / boot-smoke carry `continue-on-error` until each
#            has gone green once on a stock GitHub runner.  They need cross
#            toolchains this workflow could not be exercised against before
#            being committed; drop the flag when they are proven.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  lint:
    name: lint (fast gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # merge-base against origin/master

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Gate suite self-test
        run: tools/check/selftest.sh

      - name: Fast gates on changed files
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          tools/check/run.sh --base "${base:-origin/master}" --tier fast

      - name: Fast gates on whole tree (baseline ratchet)
        run: tools/check/run.sh --all banned-api syscall-table

  build:
    name: build ${{ matrix.arch }}
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until proven green on a stock runner
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake binutils gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            mtools qemu-utils python3

      - name: Kernel (${{ matrix.arch }})
        # Linux has no *-elf- triplets; use the distro cross compilers.  The
        # target makefiles assign CROSS_PREFIX, the command line overrides it.
        run: |
          case "${{ matrix.arch }}" in
            aarch64) prefix=aarch64-linux-gnu- ;;
            x86_64)  prefix= ;;
          esac
          bmake kernel TARGET=${{ matrix.arch }} CROSS_PREFIX="$prefix"

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.arch }}-${{ github.sha }}
          path: build/${{ matrix.arch }}/boot/kernel*
          retention-days: 7

  analyze:
    name: analyze (tidy, cppcheck, warnings)
    needs: lint
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory until baselines settle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-format clang-tidy cppcheck gcc-aarch64-linux-gnu gcc

      - name: CI-tier gates on changed files
        # check_cc_for() looks for aarch64-elf-gcc / x86_64-elf-gcc; point it at
        # the distro compilers (syntax-only, no linking, so the triplet is fine).
        env:
          AARCH64_CC: aarch64-linux-gnu-gcc
          X86_64_CC: gcc
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          tools/check/run.sh --base "${base:-origin/master}" --tier ci \
            header-selfcontained warnings clang-tidy cppcheck

  boot-smoke:
    name: boot smoke (${{ matrix.arch }})
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true   # advisory: image build on Linux not yet proven
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bmake binutils gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            mtools qemu-utils qemu-system-arm qemu-system-x86 python3

      - name: Build kernel, world and image
        run: |
          case "${{ matrix.arch }}" in
            aarch64) prefix=aarch64-linux-gnu- ;;
            x86_64)  prefix= ;;
          esac
          bmake kernel world image TARGET=${{ matrix.arch }} CROSS_PREFIX="$prefix"

      - name: Boot to login on a copy of the image
        run: tools/check/run.sh --strict --arch ${{ matrix.arch }} boot-smoke
